server:
  port: 8083

spring:
  data:
    redis:
      host: localhost
      port: 6379
    
  application:
    name: user-service

eureka:
  instance:
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka

management:
  tracing:
    sampling:
      probability: 1.0  # 모든 요청 추적
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

  endpoints:
    web:
      exposure:
        include: '*'

  jwt:
    private-key: 
    expire-time:
      access-token: 900000
      refresh-token: 2592000000
    
